<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联系 — Symbion 中国区</title>
  <meta name="description" content="开始构建你的 Symbion。">
  <link rel="canonical" href="https://www.symbionspace.com/company/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="Symbion">
  <meta property="og:url" content="https://www.symbionspace.com/company/contact.html">
  <meta property="og:title" content="联系 — Symbion 中国区">
  <meta property="og:description" content="开始构建你的 Symbion。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/site.css?v=ice74">
</head>
<body data-root=".." data-page="contact">
  <header class="nav" id="site-nav"></header>
  <main class="page wrap">

    <h1>你的 AI，可以从这里开始。</h1>
    <p class="lead">留下工作邮箱，或写信到 <a href="mailto:hello@symbionspace.com">hello@symbionspace.com</a>。我们会联系中国区开放与 Cosmo 探索。</p>
    <form class="form" id="start-form">
      <label for="name">姓名</label>
      <input id="name" name="name" required autocomplete="name">
      <label for="email">工作邮箱</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="role">你更接近</label>
      <select id="role" name="role">
        <option>个人研究者 / 创作者</option>
        <option>专业人士</option>
        <option>团队</option>
        <option>合作与媒体</option>
      </select>
      <label for="note">你希望 Citta 先帮你完成什么</label>
      <textarea id="note" name="note" placeholder="例如：中国 AI Agent 市场分析"></textarea>
      <button class="btn btn-blue" type="submit">立即开始</button>
    </form>
    <p class="ok" id="form-ok" hidden>已记下。没有自动发送任何内容到外部——这是站点演示回执。</p>
    
  </main>
  <footer class="site-foot" id="site-foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="../js/site.js?v=ice53"></script>
</body>
</html>
