<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 — Symbion</title>
  <meta name="description" content="登录或注册 Symbion。">
  <link rel="canonical" href="https://www.symbionspace.com/login.html">
  <meta property="og:url" content="https://www.symbionspace.com/login.html">
  <meta property="og:title" content="登录 — Symbion">
  <meta property="og:locale" content="zh_CN">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/site.css?v=ice89">
</head>
<body class="auth" data-root=".">
  <div class="auth-field" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="auth-frame">
    <a class="auth-mark" href="index.html" aria-label="回到首页">
      <img src="mark.svg" width="36" height="25" alt="">
    </a>
    <h1>登录</h1>
    <p class="auth-lead">用你的身份进入工作空间。</p>

    <form id="auth-form">
      <label for="auth-email">邮箱</label>
      <input id="auth-email" type="email" name="email" autocomplete="email" required placeholder="you@symbionspace.com">
      <label for="auth-pass">密码</label>
      <input id="auth-pass" type="password" name="password" autocomplete="current-password" required placeholder="••••••••••••">
      <button class="auth-go" id="auth-email-btn" type="submit">继续</button>
    </form>

    <p class="auth-or">或</p>

    <div class="sso">
      <button type="button" class="sso-btn" data-sso="apple">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.4c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-0.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.3c.7-1.1 1-2.1 1-2.2-.1 0-2.1-.8-2.1-3.2zM14.6 5.8c.6-.8 1.1-1.8.9-2.8-0.9 0-2 .6-2.6 1.4-.6.7-1.1 1.8-.9 2.8 1 .1 2-.5 2.6-1.4z"/></svg>
        <span>Apple</span>
      </button>
      <button type="button" class="sso-btn" data-sso="google">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8c-.2 1.1-.9 2.1-1.9 2.7v2.2h3.1c1.8-1.7 2.6-4.1 2.6-6.5z"/>
          <path fill="#34A853" d="M9 18c2.6 0 4.8-.9 6.4-2.3l-3.1-2.2c-.9.6-2 .9-3.3.9-2.5 0-4.6-1.7-5.4-4H.4v2.3C2 16 5.3 18 9 18z"/>
          <path fill="#FBBC05" d="M3.6 10.4c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V4.3H.4C-.1 5.4-.4 6.7-.4 8.1s.3 2.7.8 3.8l3.2-1.5z"/>
          <path fill="#EA4335" d="M9 3.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7C13.8.9 11.6 0 9 0 5.3 0 2 2 .4 4.3l3.2 2.3C4.4 5.3 6.5 3.6 9 3.6z"/>
        </svg>
        <span>Google</span>
      </button>
    </div>

    <p class="auth-fine">继续即表示同意 <a href="legal/terms.html">条款</a> 与 <a href="legal/privacy.html">隐私</a>。</p>
  </main>
  <script src="js/site.js?v=ice53"></script>
</body>
</html>
