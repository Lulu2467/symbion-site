<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 — Symbion</title>
  <meta name="description" content="登录或注册 Symbion。">
  <link rel="canonical" href="https://www.symbionspace.com/login.html">
  <meta property="og:url" content="https://www.symbionspace.com/login.html">
  <meta property="og:title" content="登录 — Symbion">
  <meta property="og:locale" content="zh_CN">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/site.css?v=ice151">
</head>
<body class="auth" data-root=".">
  <a class="auth-back" id="auth-back" data-back href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
    返回
  </a>
  <div class="auth-field" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="auth-frame">
    <a class="auth-mark" href="index.html" aria-label="回到首页">
      <img src="mark.svg" width="36" height="25" alt="">
    </a>
    <h1>登录</h1>
    <p class="auth-lead">用你的身份进入工作空间。</p>

    <form id="auth-form">
      <label for="auth-email">邮箱</label>
      <input id="auth-email" type="email" name="email" autocomplete="email" required placeholder="you@symbionspace.com">
      <label for="auth-pass">密码</label>
      <input id="auth-pass" type="password" name="password" autocomplete="current-password" required placeholder="••••••••••••">
      <button class="auth-go" id="auth-email-btn" type="submit">继续</button>
      <p class="auth-error" id="auth-error" hidden>请填写有效邮箱。</p>
    </form>

    <p class="auth-or">或</p>

    <div class="sso">
      <button type="button" class="sso-btn" data-sso="apple">
        <svg viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M791.488 544.095c-1.28-129.695 105.76-191.871 110.528-194.975-60.16-88.032-153.856-100.064-187.232-101.472-79.744-8.064-155.584 46.944-196.064 46.944-40.352 0-102.816-45.76-168.96-44.544-86.912 1.28-167.072 50.528-211.808 128.384-90.304 156.703-23.136 388.831 64.896 515.935 43.008 62.208 94.304 132.064 161.632 129.568 64.832-2.592 89.376-41.952 167.744-41.952s100.416 41.952 169.056 40.672c69.76-1.312 113.984-63.392 156.704-125.792 49.376-72.16 69.728-142.048 70.912-145.632-1.536-0.704-136.064-52.224-137.408-207.136zM662.56 163.52C698.304 120.16 722.432 60 715.84 0c-51.488 2.112-113.888 34.304-150.816 77.536-33.152 38.368-62.144 99.616-54.368 158.432 57.472 4.48 116.128-29.216 151.904-72.448z"/></svg>
        <span>Apple</span>
      </button>
      <button type="button" class="sso-btn" data-sso="google">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8c-.2 1.1-.9 2.1-1.9 2.7v2.2h3.1c1.8-1.7 2.6-4.1 2.6-6.5z"/>
          <path fill="#34A853" d="M9 18c2.6 0 4.8-.9 6.4-2.3l-3.1-2.2c-.9.6-2 .9-3.3.9-2.5 0-4.6-1.7-5.4-4H.4v2.3C2 16 5.3 18 9 18z"/>
          <path fill="#FBBC05" d="M3.6 10.4c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V4.3H.4C-.1 5.4-.4 6.7-.4 8.1s.3 2.7.8 3.8l3.2-1.5z"/>
          <path fill="#EA4335" d="M9 3.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7C13.8.9 11.6 0 9 0 5.3 0 2 2 .4 4.3l3.2 2.3C4.4 5.3 6.5 3.6 9 3.6z"/>
        </svg>
        <span>Google</span>
      </button>
    </div>

    <p class="auth-fine">继续即表示同意 <a href="legal/terms.html">条款</a> 与 <a href="legal/privacy.html">隐私</a>。</p>
  </main>
  <script src="js/site.js?v=ice60"></script>
</body>
</html>
